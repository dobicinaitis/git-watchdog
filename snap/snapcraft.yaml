name: git-watchdog
base: core26
version: '0.2.0'
title: git-watchdog
license: MIT
summary: Read-only Git remotes while selected processes (e.g. AI agents) run
description: |
  AI coding agents run commands with your permissions, including your SSH keys
  and Git credentials. A single unattended `git push` can force-push over shared
  history, delete a branch or publish unreviewed code, and that is hard to undo
  once it reaches the server.

  `git-watchdog` removes push access while an agent is running. As long as a
  watched process is alive (by default the `claude` CLI and Claude Desktop), it
  puts the remotes of your local repositories in **read-only mode**:

  * **Pushing is blocked**, so `git push` fails instead of reaching the server.
  * **Fetching keeps working** through a read-only access token, so the agent doesn't need your SSH key to pull.

  When the process exits, the original remotes are restored exactly as they
  were. It guards against accidental pushes, not a determined attacker; see
  https://github.com/dobicinaitis/git-watchdog#security-notes

  After installation, run `git watchdog init` once, then `git watchdog` to see the status.
icon: snap/local/logo.png
source-code:
  - https://github.com/dobicinaitis/git-watchdog
website:
  - https://github.com/dobicinaitis/git-watchdog
issues:
  - https://github.com/dobicinaitis/git-watchdog/issues
contact:
  - https://github.com/dobicinaitis/git-watchdog/discussions
grade: stable
confinement: strict

apps:
  git-watchdog:
    command: bin/git-watchdog
    completer: completions/git-watchdog # bash completion, installed by snapd
    environment:
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
    plugs:
      - home                    # Git repositories under $HOME
      - system-observe          # see other processes (pgrep/ps)

  # Started at desktop login through the autostart file that "git watchdog init"
  # writes to $SNAP_USER_DATA/.config/autostart (user daemons are still experimental in snapd).
  daemon:
    command: bin/git-watchdog daemon
    autostart: git-watchdog-daemon.desktop
    environment:
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
    plugs:
      - home
      - system-observe

parts:
  git-watchdog:
    plugin: nil
    source: .
    override-build: |
      install -D -m 755 git-watchdog.sh "$CRAFT_PART_INSTALL/bin/git-watchdog"
      install -d "$CRAFT_PART_INSTALL/completions"
      bash git-watchdog.sh completion > "$CRAFT_PART_INSTALL/completions/git-watchdog"

  runtime:
    plugin: nil
    stage-packages:
      - git
      - procps
